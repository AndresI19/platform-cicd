[pytest]
# Keep going after a failure. The default already does, but making it explicit states the intent:
# this suite's job is a COMPLETE picture of what is broken, so one dead service must not hide the
# state of the five behind it. The report posted at the end is only as useful as it is complete.
addopts = -ra --tb=short --maxfail=0

testpaths = .
python_files = test_*.py

# No session timeout here on purpose: that would need pytest-timeout, and a dependency whose only job
# is bounding a run is one more thing that can fail to install. Individual requests carry their own
# deadline (FVT_TIMEOUT, default 20s) and the systemd unit sets TimeoutStartSec as the real backstop.
